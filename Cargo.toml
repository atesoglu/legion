[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/engine",
    "crates/platform",
    "crates/proto",
    "data-plane/sentinel",
    "data-plane/engines/velocity",
    "data-plane/engines/device",
    "data-plane/engines/geo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/atesoglu/legion"

[workspace.dependencies]
legion-common = { path = "crates/common" }
legion-engine = { path = "crates/engine" }
legion-platform = { path = "crates/platform" }
legion-proto = { path = "crates/proto" }

humantime = "2"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
thiserror = "2"
tokio = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
# Legion's Rust is safe Rust. `unsafe` is not a performance strategy; it is a
# last resort that must be justified by a profile, benchmarked, reviewed and
# documented in an ADR before this line is relaxed.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Panics on the decision path are outages. Fail with a typed error instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Silent numeric wrapping would corrupt scores without any signal.
arithmetic_side_effects = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# Panics must not be swallowed by a partially unwound worker on the hot path.
panic = "abort"
# Kept so that latency profiles map to source lines.
debug = 1
