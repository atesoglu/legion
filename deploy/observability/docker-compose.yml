# ADR-020 observability stack, local verification only -- not the ADR-011
# deployment target (Kubernetes/Helm, deliberately parked).
#
# Wiring: gateway --OTLP--> otel-collector --Prometheus exposition--> prometheus
#         gateway --stdout--> (docker log driver) --> filebeat --> elasticsearch --> kibana
#
# ES security is ENABLED on purpose (owner's explicit choice): TLS certs
# generated by `setup`, and three separate credentials (elastic, kibana_system,
# filebeat_internal) rather than one shared superuser reused everywhere.
#
# Bring the whole thing up with: docker compose up -d
# Then run gateway alone against it -- see deploy/observability/README.md.

services:
  # --- certs + credentials, run once before the rest starts -----------------
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set ELASTIC_PASSWORD in .env"; exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set KIBANA_PASSWORD in .env"; exit 1;
        elif [ x${FILEBEAT_PASSWORD} == x ]; then
          echo "Set FILEBEAT_PASSWORD in .env"; exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: elasticsearch\n"\
          "    dns:\n"\
          "      - elasticsearch\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip \
            --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions";
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 {} \;;
        find . -type f -exec chmod 640 {} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://elasticsearch:9200 | grep -q "missing authentication credentials"; do sleep 5; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 5; done;
        echo "Creating filebeat_writer role (least privilege: this repo does not hand Beats the elastic superuser)";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" https://elasticsearch:9200/_security/role/filebeat_writer \
          -d "{\"cluster\":[\"monitor\",\"manage_ilm\",\"manage_index_templates\"],\"indices\":[{\"names\":[\"filebeat-*\"],\"privileges\":[\"create_index\",\"create_doc\",\"manage\",\"monitor\"]}]}" \
          | grep -q "\"created\""; do sleep 5; done;
        echo "Creating filebeat_internal user";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/filebeat_internal \
          -d "{\"password\":\"${FILEBEAT_PASSWORD}\",\"roles\":[\"filebeat_writer\"]}" \
          | grep -q "\"created\":true"; do sleep 5; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  elasticsearch:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - node.name=elasticsearch
      - cluster.name=legion-observability
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 60

  kibana:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 60

  filebeat:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
    user: root
    # --strict.perms=false: the config file arrives via a Windows-host bind
    # mount, which cannot reproduce Linux mode 600 -- filebeat's default
    # permission check refuses to start on such a mount. Documented Elastic
    # workaround for exactly this host case, not a security relaxation of ES
    # itself (filebeat still authenticates with its own least-privilege user
    # over TLS). -e sends filebeat's own logs to stderr so `docker logs`
    # actually shows something, instead of the default log file.
    command: ["--strict.perms=false", "-e"]
    environment:
      - FILEBEAT_PASSWORD=${FILEBEAT_PASSWORD}
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - certs:/usr/share/filebeat/certs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:8889:8889"

  prometheus:
    depends_on:
      - otel-collector
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    depends_on:
      - prometheus
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"

  # --- one real Legion service, wired to prove signals actually flow --------
  gateway:
    depends_on:
      - otel-collector
    image: legion/gateway:dev
    environment:
      - LEGION_OTLP_ENDPOINT=otel-collector:4317
      - LEGION_API_KEYS=smoke-test-caller=01234567890123456789012345678901
      # No orchestrator runs in this stack; gateway dials lazily and degrades
      # per-request rather than failing to start (see gateway/main.go's warm()).
      - LEGION_ORCHESTRATOR_ENDPOINT=127.0.0.1:9200
    ports:
      - "127.0.0.1:9100:9100"

volumes:
  certs:
    driver: local
  esdata:
    driver: local
  kibanadata:
    driver: local
