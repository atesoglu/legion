# ADR-020: Prometheus scrapes exactly one target -- the collector's own
# Prometheus exposition endpoint. It never receives OTLP and no service is
# scraped directly (every zone would otherwise need an inbound listener).
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
